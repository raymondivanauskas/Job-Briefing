<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Job Briefing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    
    <style>
        /* MOBILE / SCREEN STYLING */
        body { background-color: #f3f4f6; font-family: Arial, sans-serif; }
        .section-card { background: white; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; border: 1px solid #d1d5db; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 1px solid #9ca3af; border-radius: 0.25rem; background: #ffffff; font-size: 16px; margin-top: 0.25rem; color: #000; }
        input[type="checkbox"] { width: 1.5rem; height: 1.5rem; }
        label { display: block; font-weight: bold; color: #374151; font-size: 0.9rem; margin-top: 0.75rem; }
        .grid-layout { display: grid; gap: 0.5rem; grid-template-columns: 1fr; }
        .grid-2 { display: grid; gap: 0.5rem; grid-template-columns: 1fr 1fr; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.25rem; font-weight: bold; text-align: center; cursor: pointer; display: block; width: 100%; margin-top: 0.5rem; background-color: #1e3a8a; color: white; }
        .btn-gray { background-color: #d1d5db; color: #111827; }
        .btn-red { background-color: #dc2626; color: white; }
        
        #signature-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; align-items: center; justify-content: center; }
        #signature-pad-container { background: white; padding: 1rem; border-radius: 0.5rem; width: 95%; max-width: 500px; }

        /* STRICT PAPER-REPLICA PRINT STYLING */
        @media print {
            @page { margin: 0.4in; size: letter portrait; }
            body { background-color: white !important; padding: 0 !important; font-size: 10pt; color: black; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
            
            /* Reconstruct the PNR tabular look */
            .section-card { border: 1px solid #000 !important; padding: 0 !important; margin-bottom: 0.5rem !important; border-radius: 0 !important; box-shadow: none !important; page-break-inside: avoid; }
            
            /* Blue Headers mimicking the paper form */
            h2 { background-color: #b4c6e7 !important; color: #000 !important; font-size: 11pt; font-weight: bold; text-align: center; border-bottom: 1px solid #000; padding: 4px; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            
            /* Convert grids to look like table cells */
            .grid-layout, .grid-2 { display: flex; flex-wrap: wrap; gap: 0; }
            .grid-layout > div, .grid-2 > div { flex: 1 1 48%; border: 1px solid #000; margin: -1px 0 0 -1px; padding: 2px 4px; background-color: #eaeff7 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; display: flex; align-items: center; }
            .col-span-2 { flex: 1 1 100% !important; }
            
            /* Strip input boxes and just leave the text */
            input, textarea, select { border: none !important; background: transparent !important; padding: 0 0 0 5px !important; margin: 0 !important; font-size: 10pt !important; width: auto; flex-grow: 1; height: auto !important; resize: none; color: #000; }
            
            label { font-size: 9pt; color: #000 !important; font-weight: normal; margin: 0; white-space: nowrap; }
            
            /* Hide UI elements */
            .no-print, .btn, .fixed, input[type="file"] { display: none !important; }
            img { max-height: 250px; border: 1px solid #000; display: block; margin: 5px auto; }
            .cancelled-top { display: none !important; }
        }
    </style>
</head>
<body class="p-2 sm:p-4 pb-24 text-gray-900" id="app-container">

    <div class="mb-4 bg-white p-4 rounded border-b-4 border-blue-900 section-card no-print">
        <h1 class="text-xl font-bold text-center uppercase">Job Briefing</h1>
    </div>

    <form id="briefing-form">
        <!-- Site Info -->
        <div class="section-card">
            <h2>Site Information</h2>
            <div class="grid-2">
                <div><label>Date & Time:</label><input type="datetime-local" id="datetime"></div>
                <div><label>Head Count:</label><input type="number" id="head_count"></div>
                <div><label>Foreman:</label><input type="text" id="foreman"></div>
                <div><label>Location:</label><input type="text" id="work_location"></div>
            </div>
        </div>

        <!-- Emergency -->
        <div class="section-card">
            <h2>Emergency Information</h2>
            <div class="grid-2">
                <div class="col-span-2"><label>Nearest Hospital:</label><textarea id="hospital" rows="1">Fetching GPS...</textarea></div>
                <div class="col-span-2"><label>Weather:</label><input type="text" id="weather" value="Fetching..."></div>
                <div><label>Fire/Ambulance:</label><input type="text" value="911"></div>
                <div><label>RTC Phone:</label><input type="text" value="1-888-641-2177"></div>
            </div>
        </div>

        <!-- Radio -->
        <div class="section-card">
            <h2>Radio / Phone Information</h2>
            <select id="location_preset" class="no-print mb-2 border p-2" onchange="updateRadioFields()">
                <option value="">-- Select location to auto-fill --</option>
                <option value='{"stdby":"57-05","rtc":"85-85","tone":"*31","emerg":"*30","dc":"#3"}'>Alexandria Sub (Mile 0.4 - 23.0)</option>
                <option value='{"stdby":"52-05","rtc":"85-85","tone":"*41","emerg":"*40","dc":"#4"}'>Alexandria Sub (Mile 23.0 - 61.0)</option>
                <option value='{"stdby":"63-05","rtc":"85-85","tone":"*11","emerg":"*10","dc":"#1"}'>Smiths Falls</option>
            </select>
            <div class="grid-2">
                <div><label>Stand-By:</label><input type="text" id="r_stdby"></div>
                <div><label>RTC Ch:</label><input type="text" id="r_rtc"></div>
                <div><label>RTC Tone:</label><input type="text" id="r_tone"></div>
                <div><label>Emerg Tone:</label><input type="text" id="r_emerg"></div>
            </div>
        </div>

        <!-- Group Photo -->
        <div class="section-card">
            <h2>Group Photo</h2>
            <input type="file" accept="image/*" capture="environment" id="group_photo_input" class="no-print p-2">
            <img id="group_photo_preview" class="hidden" alt="Group Photo">
        </div>

        <!-- TOP / Rule 42 -->
        <div class="section-card">
            <h2>Rule 42 Confirmations / TOPs</h2>
            <div id="top-container" class="grid-layout"></div>
            <button type="button" class="btn btn-gray no-print" onclick="addTOP()">+ Add Document</button>
        </div>

        <!-- Attendance -->
        <div class="section-card">
            <h2>Job Briefing Attendance</h2>
            <div id="attendance-container" class="grid-layout"></div>
            <button type="button" class="btn btn-gray no-print" onclick="addAttendanceRow()">+ Add Attendee</button>
        </div>
    </form>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t no-print z-40">
        <button type="button" class="btn shadow-lg" onclick="window.print()">Create PDF / Print</button>
    </div>

    <!-- Signature Modal -->
    <div id="signature-modal" class="no-print">
        <div id="signature-pad-container">
            <h3 class="font-bold mb-2">Sign Below</h3>
            <canvas id="sig-canvas" width="350" height="150" style="border:1px solid #000; width:100%; background:#fff; touch-action:none;"></canvas>
            <div class="grid-2 mt-2">
                <button type="button" class="btn btn-gray" onclick="document.getElementById('signature-modal').style.display='none'">Cancel</button>
                <button type="button" class="btn btn-red" onclick="sigPad.clear()">Clear</button>
                <button type="button" class="btn col-span-2" onclick="saveSignature()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('datetime').value = now.toISOString().slice(0,16);

        // Geolocation & APIs
        const hospField = document.getElementById('hospital');
        const weatherField = document.getElementById('weather');

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                    .then(r => r.json()).then(d => { weatherField.value = `${d.current_weather.temperature}°C`; })
                    .catch(() => { weatherField.value = "Manual Entry"; });

                // Optimized Overpass query for speed
                const query = `[out:json][timeout:5];(node["amenity"="hospital"](around:30000,${lat},${lon});way["amenity"="hospital"](around:30000,${lat},${lon}););out center 1;`;
                fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`)
                    .then(r => r.json()).then(d => {
                        if(d.elements.length > 0) hospField.value = `${d.elements[0].tags.name || 'Hospital'} (${d.elements[0].lat || d.elements[0].center.lat}, ${d.elements[0].lon || d.elements[0].center.lon})`;
                        else hospField.value = `None within 30km. Type manually.`;
                    }).catch(() => { hospField.value = "API Timeout. Type manually."; });
            }, () => { hospField.value = "GPS Denied."; weatherField.value = "GPS Denied."; }, { timeout: 5000 });
        }

        // Image Handling
        function handleImage(input, imgId) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById(imgId);
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        document.getElementById('group_photo_input').addEventListener('change', function() { handleImage(this, 'group_photo_preview'); });

        function updateRadioFields() {
            const val = document.getElementById('location_preset').value;
            if(!val) return;
            const data = JSON.parse(val);
            document.getElementById('r_stdby').value = data.stdby;
            document.getElementById('r_rtc').value = data.rtc;
            document.getElementById('r_tone').value = data.tone;
            document.getElementById('r_emerg').value = data.emerg;
        }

        let topCount = 0;
        function addTOP() {
            topCount++;
            const id = `top_${topCount}`;
            const html = `<div id="${id}" class="col-span-2 p-2" style="background:#fff;">
                <div class="grid-2">
                    <div><label>Auth No:</label><input type="text"></div>
                    <div><label>Limits:</label><input type="text"></div>
                </div>
                <input type="file" accept="image/*" capture="environment" class="no-print mt-2" onchange="handleImage(this, 'img_${id}')">
                <img id="img_${id}" class="hidden w-full mt-2">
            </div>`;
            document.getElementById('top-container').insertAdjacentHTML('beforeend', html);
        }

        const canvas = document.getElementById('sig-canvas');
        const sigPad = new SignaturePad(canvas);
        let currentSigImg = null;

        function addAttendanceRow() {
            const id = 'sig_' + Math.random().toString(36).substr(2, 9);
            const html = `<div class="col-span-2 grid-2" style="background:#fff;">
                <div><label>Name:</label><input type="text"></div>
                <div class="items-center"><label class="mr-2">Sign:</label>
                    <button type="button" class="btn-gray px-2 py-1 no-print text-sm" onclick="openSignaturePad('${id}')">Sign</button>
                    <img id="${id}" class="hidden h-10 border-b border-black">
                </div>
            </div>`;
            document.getElementById('attendance-container').insertAdjacentHTML('beforeend', html);
        }

        function openSignaturePad(imgId) {
            currentSigImg = document.getElementById(imgId);
            document.getElementById('signature-modal').style.display = 'flex';
            sigPad.clear();
        }

        function saveSignature() {
            if (sigPad.isEmpty()) return;
            currentSigImg.src = sigPad.toDataURL();
            currentSigImg.classList.remove('hidden');
            currentSigImg.previousElementSibling.classList.add('hidden');
            document.getElementById('signature-modal').style.display = 'none';
        }

        addTOP();
        addAttendanceRow();
    </script>
</body>
</html>
